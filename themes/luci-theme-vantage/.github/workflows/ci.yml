name: CI

# Tests and security checks on every push and pull request; packages built
# with the pinned OpenWrt SDK; releases published from v* tags only when the
# CI build matches the hashes committed in .release-manifests/<tag>.sha256.
#
# Packages are built for OpenWrt 25.12 (apk) and 24.10 (ipk). A tag's
# repository indexes are signed with the project keys: packages.adb with
# the VANTAGE_SIGN_KEY secret, Packages.sig with VANTAGE_USIGN_KEY. The
# repositories published on GitHub Pages let users install and upgrade
# without --allow-untrusted (apk) or with opkg's signature check on.
#
# Every action is pinned to a full commit SHA. The signing keys are secrets
# of the release-signing environment, which only v* tags may use and whose
# runs the maintainer approves. Only the job "Sign the package index" is
# in that environment, on a machine of its own: the build job, which
# fetches the feeds and compiles, has no secret. The signing job takes the
# packages as built, compares them with the committed manifest again, and
# hands the key to one SDK container without network, on its standard
# input; that container signs and checks the index against the public keys
# in keys/. Nothing the build produced is run there. Every other run goes
# through the same job with a key it makes and throws away ("Try the
# signing job"), so a release is never that job's first run. Write tokens
# go only to the release and Pages jobs.
#
# The site's page, screenshots and video change between releases too: a
# manual run on main with "site" ticked publishes them again, around the
# package repositories exactly as they are live (the job "Republish the
# site page"). It builds and signs nothing and has no secret.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: Publish the site page, screenshots and video again (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # a manual site run has a group of its own: it neither waits behind a
  # push run on main nor takes that run's place in the queue
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.site && '-site' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ucode as pinned by OpenWrt 25.12 (package/utils/ucode PKG_SOURCE_VERSION)
  UCODE_REPO: https://github.com/jow-/ucode.git
  UCODE_REV: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
  # the SDK releases built (keep in step with the build matrix below)
  SDK_APK: 25.12.6
  SDK_IPK: 24.10.8

jobs:
  checks:
    name: Tests and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build ucode (for the rpcd plugin tests); install gettext
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libjson-c-dev gettext
          git init -q "$RUNNER_TEMP/ucode-src"
          git -C "$RUNNER_TEMP/ucode-src" fetch -q --depth 1 "$UCODE_REPO" "$UCODE_REV"
          git -C "$RUNNER_TEMP/ucode-src" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/ucode-src" rev-parse HEAD)" = "$UCODE_REV"
          cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ucode" \
            -DCMAKE_C_FLAGS=-Wno-error=discarded-qualifiers \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DRTNL_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DDIGEST_SUPPORT=OFF \
            -DLOG_SUPPORT=OFF -DSOCKET_SUPPORT=OFF -DZLIB_SUPPORT=OFF
          cmake --build "$RUNNER_TEMP/ucode-build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/ucode-build"
          echo "UCODE=$RUNNER_TEMP/ucode/bin/ucode" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ucode/lib" >> "$GITHUB_ENV"

      - name: Unit tests
        env:
          # the catalogue tests must not skip msgfmt here
          VANTAGE_REQUIRE_GETTEXT: '1'
        run: node --test tests/

      - name: Translation templates and catalogues up to date
        # LuCI's i18n-scan.pl / i18n-update.pl at the SDK's luci feed commit
        run: dev/i18n/update.sh --check

      - name: DOM sink check
        run: node security-tests/check_dom_sinks.js

      - name: Template security test
        run: node security-tests/test_templates.js

      - name: ACL policy test
        run: node security-tests/test_acl_policy.js

      - name: Private address check
        run: node security-tests/check_private_addresses.js

  build:
    # named by OpenWrt line, not point release: the main branch's ruleset
    # requires these names, so an SDK update does not change them
    name: Build packages (OpenWrt ${{ matrix.line }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 25.12.6
            line: '25.12'
            fmt: apk
          - sdk: 24.10.8
            line: '24.10'
            fmt: ipk
    env:
      SDK_RELEASE: ${{ matrix.sdk }}
      FMT: ${{ matrix.fmt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build with the pinned SDK (verifies every package)
        # a tag's packages are built like any other commit's, without a key
        run: |
          podman --version
          dev/build/sdk-build.sh "$SDK_RELEASE" HEAD

      - name: Check against the committed release manifest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=".release-manifests/${TAG}.sha256"
          test -f "$manifest" || { echo "::error::missing $manifest"; exit 1; }
          # one manifest for both: this build's lines are the ones for its format
          ! grep -vE '\.(apk|ipk)$' "$manifest" || { echo "::error::unexpected lines in $manifest"; exit 1; }
          diff <(grep -E "\.$FMT\$" "$manifest" | sort) <(sort "dist/$SDK_RELEASE/SHA256SUMS") || {
            echo "::error::CI build does not match $manifest"; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vantage-${{ env.SDK_RELEASE }}
          path: |
            dist/${{ env.SDK_RELEASE }}/*.apk
            dist/${{ env.SDK_RELEASE }}/*.ipk
            dist/${{ env.SDK_RELEASE }}/SHA256SUMS
            dist/${{ env.SDK_RELEASE }}/BUILDINFO
          if-no-files-found: error

  # A release's index is signed here, on a machine that built nothing: it
  # has the checkout and the packages as the build job uploaded them, and
  # runs no program from that build. A pushed tag only: a manual run on a
  # tag ref never sees the keys.
  sign:
    # named by OpenWrt line, as the build jobs are
    name: Sign the package index (OpenWrt ${{ matrix.line }})
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # the only job in the release-signing environment (approved per run, v*
    # tags only): the approval comes after the packages are built
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 25.12.6
            line: '25.12'
            fmt: apk
          - sdk: 24.10.8
            line: '24.10'
            fmt: ipk
    env:
      SDK_RELEASE: ${{ matrix.sdk }}
      FMT: ${{ matrix.fmt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the packages as built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vantage-${{ env.SDK_RELEASE }}
          path: dist/${{ env.SDK_RELEASE }}

      - name: Check against the committed release manifest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=".release-manifests/${TAG}.sha256"
          test -f "$manifest" || { echo "::error::missing $manifest"; exit 1; }
          # one manifest for both: this build's lines are the ones for its format
          ! grep -vE '\.(apk|ipk)$' "$manifest" || { echo "::error::unexpected lines in $manifest"; exit 1; }
          diff <(grep -E "\.$FMT\$" "$manifest" | sort) <(sort "dist/$SDK_RELEASE/SHA256SUMS") || {
            echo "::error::CI build does not match $manifest"; exit 1; }

      - name: Sign the package index
        env:
          SIGN_KEY: ${{ matrix.fmt == 'apk' && secrets.VANTAGE_SIGN_KEY || secrets.VANTAGE_USIGN_KEY }}
        run: |
          set -euo pipefail
          # out of the environment before anything is started, then to the
          # signing container's standard input: no file, no argument
          key=$SIGN_KEY
          unset SIGN_KEY
          test -n "$key" || { echo "::error::the signing key secret for $FMT is not set"; exit 1; }
          printf '%s\n' "$key" | VANTAGE_SIGN_KEY=- dev/build/sdk-build.sh --sign "$SDK_RELEASE"

      - name: Upload the signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ env.SDK_RELEASE }}
          path: |
            dist/${{ env.SDK_RELEASE }}/*.apk
            dist/${{ env.SDK_RELEASE }}/*.ipk
            dist/${{ env.SDK_RELEASE }}/SHA256SUMS
            dist/${{ env.SDK_RELEASE }}/BUILDINFO
            dist/${{ env.SDK_RELEASE }}/packages.adb
            dist/${{ env.SDK_RELEASE }}/Packages
            dist/${{ env.SDK_RELEASE }}/Packages.gz
            dist/${{ env.SDK_RELEASE }}/Packages.sig
          if-no-files-found: error

  # The signing job on every run that is not a pushed tag, step for step,
  # with a key made in the SDK image and thrown away, and no manifest (a
  # commit that is no release has none). A release must not be the first
  # run of that job: this one goes through the download, the container
  # without network, the checks in it and the upload on every pull request.
  # What it uploads is no release signature.
  rehearsal:
    name: Try the signing job with a throwaway key (OpenWrt ${{ matrix.line }})
    needs: build
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 25.12.6
            line: '25.12'
            fmt: apk
          - sdk: 24.10.8
            line: '24.10'
            fmt: ipk
    env:
      SDK_RELEASE: ${{ matrix.sdk }}
      FMT: ${{ matrix.fmt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the packages as built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vantage-${{ env.SDK_RELEASE }}
          path: dist/${{ env.SDK_RELEASE }}

      - name: Sign the package index
        run: |
          set -euo pipefail
          key=$(dev/build/sdk-build.sh --throwaway-key "$SDK_RELEASE" "$RUNNER_TEMP/throwaway.pub")
          printf '%s\n' "$key" | VANTAGE_SIGN_KEY=- VANTAGE_SIGN_PUB="$RUNNER_TEMP/throwaway.pub" dev/build/sdk-build.sh --sign "$SDK_RELEASE"

      - name: Upload the signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ env.SDK_RELEASE }}
          retention-days: 1
          path: |
            dist/${{ env.SDK_RELEASE }}/*.apk
            dist/${{ env.SDK_RELEASE }}/*.ipk
            dist/${{ env.SDK_RELEASE }}/SHA256SUMS
            dist/${{ env.SDK_RELEASE }}/BUILDINFO
            dist/${{ env.SDK_RELEASE }}/packages.adb
            dist/${{ env.SDK_RELEASE }}/Packages
            dist/${{ env.SDK_RELEASE }}/Packages.gz
            dist/${{ env.SDK_RELEASE }}/Packages.sig
          if-no-files-found: error

  release:
    name: Publish release
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: release

      - name: Create or complete the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          a="release/signed-$SDK_APK" i="release/signed-$SDK_IPK"
          ( cd "$a" && sha256sum -c SHA256SUMS )
          ( cd "$i" && sha256sum -c SHA256SUMS )
          # 25.12 keeps the asset names it always had; 24.10's sums and
          # build record get a suffix
          mkdir assets
          cp "$a"/*.apk "$a"/packages.adb "$a"/SHA256SUMS "$a"/BUILDINFO assets/
          cp "$i"/*.ipk assets/
          cp "$i"/SHA256SUMS assets/SHA256SUMS-24.10
          cp "$i"/BUILDINFO assets/BUILDINFO-24.10
          cd assets
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # a retry. An asset the release already has is never replaced
            # and never taken by its name: it must be this build's file,
            # by SHA-256, or the job fails before anything is uploaded
            have=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
            mkdir ../existing
            for f in *; do
              grep -qxF -- "$f" <<< "$have" || continue
              gh release download "$TAG" --repo "$REPO" --pattern "$f" --dir ../existing
              built=$(sha256sum < "$f")
              there=$(sha256sum < "../existing/$f")
              [ "$built" = "$there" ] || {
                echo "::error::release asset $f is not this build's file (sha256 ${there%% *}, built ${built%% *})"; exit 1; }
            done
            for f in *; do
              grep -qxF -- "$f" <<< "$have" || gh release upload "$TAG" "$f" --repo "$REPO"
            done
            # a create that was cut off after its draft was made leaves the
            # release unpublished, and Pages would get ahead of it: publish
            # it, as this build's release only. It holds exactly this
            # build's files (a draft may have others from before; a public
            # release's other assets are not this step's business), and
            # its tag is on the repository at this run's commit: publishing
            # a draft whose tag is gone would make the tag anew
            draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)
            if [ "$draft" = true ]; then
              holds=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort)
              [ "$holds" = "$(ls | sort)" ] || {
                echo "::error::the draft release does not hold exactly this build's files; it stays a draft"; exit 1; }
              at=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha) || at=
              [ "$at" = "$GITHUB_SHA" ] || {
                echo "::error::tag $TAG is not at this run's commit on the repository (${at:-no such tag}); the release stays a draft"; exit 1; }
              gh release edit "$TAG" --repo "$REPO" --draft=false
            fi
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "Vantage ${TAG#v}" \
              --notes "Packages for OpenWrt ${SDK_APK} (apk) and ${SDK_IPK} (ipk), built by CI from ${GITHUB_SHA}. What changed: https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md. See SHA256SUMS, SHA256SUMS-24.10, the BUILDINFO files and docs/INSTALL.md." \
              *
          fi

  repository:
    name: Publish signed package repositories
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - name: Checkout (public key and site page)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: release

      - name: Assemble the site
        run: |
          set -euo pipefail
          a="release/signed-$SDK_APK" i="release/signed-$SDK_IPK"
          ( cd "$a" && sha256sum -c SHA256SUMS )
          ( cd "$i" && sha256sum -c SHA256SUMS )
          mkdir -p "site/${SDK_APK%.*}" "site/${SDK_IPK%.*}"
          cp "$a"/*.apk "$a"/packages.adb "$a"/SHA256SUMS "site/${SDK_APK%.*}/"
          cp "$i"/*.ipk "$i"/Packages "$i"/Packages.gz "$i"/Packages.sig "$i"/SHA256SUMS "site/${SDK_IPK%.*}/"
          cp keys/vantage-signing.pem keys/vantage-24.10.usign.pub site/
          cp dev/build/repo-index.html site/index.html
          mkdir -p site/screenshots && cp docs/screenshots/*.png docs/screenshots/*.mp4 site/screenshots/
          find site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # the run's artifact list can lag the upload by a moment, and the
      # deploy then finds no artifact: on any failure, try once more
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (second try)
        id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  site:
    # by hand, on main: the page, its screenshots and the video as they are
    # on main, around the package repositories as they are live. Those are
    # fetched from the site and must be the latest release's; nothing is
    # built or signed, and the job has no secret
    name: Republish the site page
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.site && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - name: Checkout (public key and site page)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the live package repositories
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq signify-openbsd
          live="https://$GITHUB_REPOSITORY_OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          latest="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          a=${SDK_APK%.*} i=${SDK_IPK%.*}
          get() { mkdir -p "${2%/*}"; curl -fsSL --retry 3 -o "$2" "$1"; }
          fetch() { local line=$1 f; shift; for f in "$@"; do get "$live/$line/$f" "site/$line/$f"; done; }
          get "$latest/SHA256SUMS" release/SHA256SUMS
          get "$latest/packages.adb" release/packages.adb
          get "$latest/SHA256SUMS-$i" "release/SHA256SUMS-$i"
          fetch "$a" SHA256SUMS packages.adb
          fetch "$i" SHA256SUMS Packages Packages.gz Packages.sig
          # what is live must be the latest release, before a name in it is used
          cmp "site/$a/SHA256SUMS" release/SHA256SUMS
          cmp "site/$a/packages.adb" release/packages.adb
          cmp "site/$i/SHA256SUMS" "release/SHA256SUMS-$i"
          fetch "$a" $(awk '{ print $2 }' "site/$a/SHA256SUMS")
          fetch "$i" $(awk '{ print $2 }' "site/$i/SHA256SUMS")
          ( cd "site/$a" && sha256sum -c SHA256SUMS )
          ( cd "site/$i" && sha256sum -c SHA256SUMS )
          # the 24.10 index is no release asset: it must be signed with the
          # project's key and list these packages
          signify-openbsd -V -q -p keys/vantage-24.10.usign.pub -x "site/$i/Packages.sig" -m "site/$i/Packages"
          gunzip -c "site/$i/Packages.gz" | cmp - "site/$i/Packages"
          for h in $(awk '{ print $1 }' "site/$i/SHA256SUMS"); do
            grep -qx "SHA256sum: $h" "site/$i/Packages" || { echo "Packages does not list $h" >&2; exit 1; }
          done
          # the keys on main must be the ones that are live
          for k in vantage-signing.pem vantage-24.10.usign.pub; do
            get "$live/$k" "release/$k"
            cmp "release/$k" "keys/$k"
          done

      - name: Assemble the site
        run: |
          set -euo pipefail
          cp keys/vantage-signing.pem keys/vantage-24.10.usign.pub site/
          cp dev/build/repo-index.html site/index.html
          mkdir -p site/screenshots && cp docs/screenshots/*.png docs/screenshots/*.mp4 site/screenshots/
          find site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # the run's artifact list can lag the upload by a moment, and the
      # deploy then finds no artifact: on any failure, try once more
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (second try)
        id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
