name: Update honk version

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      aggressive:
        description: 'Aggressive mode (use Glassyiris/honk test releases)'
        type: boolean
        default: true

env:
  # 激进模式开关：设为 true 使用 Glassyiris/honk 开发者测试源码及最新二进制（含 prerelease），设为 false 切回官方 daeuniverse/honk
  AGGRESSIVE_MODE: true

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update honk core version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update honk version
        env:
          INPUT_AGGRESSIVE: ${{ github.event.inputs.aggressive }}
        run: |
          if [ -n "$INPUT_AGGRESSIVE" ]; then
            AGGRESSIVE_MODE="$INPUT_AGGRESSIVE" bash scripts/update_honk_version.sh
          else
            bash scripts/update_honk_version.sh
          fi

      - name: Update doona dashboard
        run: bash scripts/update_doona.sh

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add honk/Makefile luci-app-honk/root/etc/honk/doona

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change."
          else
            TAG="$(grep '^HONK_RELEASE_TAG:=' honk/Makefile | cut -d= -f2 || true)"
            VER="$(grep '^PKG_VERSION:=' honk/Makefile | cut -d= -f2 || true)"
            git commit -m "auto: update honk ${TAG} (${VER}) and doona dashboard"

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: master

      - name: Trigger build packages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Build packages" --ref master
