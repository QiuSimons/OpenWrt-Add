[package]
name = "flowcone-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "flowcone"
path = "src/main.rs"

[dependencies]
flowcone-common = { path = "../flowcone-common" }
aya = "0.14.0"
rustix = { version = "1.1.4", default-features = false, features = ["std", "net", "time", "pipe", "event"] }
signal-hook-registry = "1.4"
