[target.bpfel-unknown-none]
rustflags = [
  "-C",
  "opt-level=2",
  "-C",
  "llvm-args=-inline-threshold=300",
  "-C",
  "linker=bpf-linker",
  "-C",
  "debuginfo=2",
  "-C",
  "link-arg=--emit=obj",
  "-C",
  "link-arg=--btf",
  "-C",
  "link-arg=--llvm-args=-bpf-stack-size=4096",
  # BTF is required for bpf_loop callback func_info. The target must have
  # vmlinux BTF available (CONFIG_DEBUG_INFO_BTF or external vmlinux-btf).
]
