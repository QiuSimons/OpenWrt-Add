[target.bpfel-unknown-none]
rustflags = [
  "-C",
  "opt-level=2",
  "-C",
  "llvm-args=-inline-threshold=300",
  "-C",
  "linker=bpf-linker",
  "-C",
  "debuginfo=2",
  "-C",
  "link-arg=--emit=obj",
  "-C",
  "link-arg=--llvm-args=-bpf-stack-size=4096",
  # No `--btf`: a BTF-carrying object is validated against vmlinux BTF by the
  # kernel, which fails on targets without CONFIG_DEBUG_INFO_BTF.
]
