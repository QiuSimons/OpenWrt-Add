[target.bpfel-unknown-none]
rustflags = [
  "-C",
  "opt-level=2",
  "-C",
  "llvm-args=-inline-threshold=300",
  "-C",
  "linker=bpf-linker",
  "-C",
  "debuginfo=2",
  "-C",
  "link-arg=--emit=obj",
  "-C",
  "link-arg=--btf",
  # Emit .BTF/.BTF.ext func_info and line_info for BPF-to-BPF subprogram verification.
]
