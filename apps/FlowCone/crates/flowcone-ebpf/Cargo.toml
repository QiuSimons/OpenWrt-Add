[package]
name = "flowcone-ebpf"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
aya-ebpf = "0.2"
flowcone-common = { path = "../flowcone-common" }

[[bin]]
name = "flowcone-ebpf"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 2
