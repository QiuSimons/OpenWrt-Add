name: Build and commit eBPF

on:
  push:
    branches:
      - master
    paths:
      - 'crates/flowcone-ebpf/**'
      - 'crates/flowcone-common/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ebpf-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ebpf:
    name: Build eBPF and commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # dtolnay/rust-toolchain accepts exactly one toolchain name in `toolchain`,
      # so stable and nightly must be installed by separate steps. The action
      # makes the last installed toolchain the default, hence the explicit
      # `rustup default stable` afterwards (xtask invokes `cargo +nightly` itself).
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src,clippy,rustfmt

      - name: Use stable as default toolchain
        shell: bash
        run: rustup default stable

      - name: Install LLVM tools and bpf-linker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm binutils
          curl -sSfL https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst | sudo tar --zstd -xf - -C /usr/local/bin
          bpf-linker --version

      - name: Check common tests and eBPF lints
        shell: bash
        run: |
          SYSROOT=$(rustc +nightly --print sysroot)
          for f in "$SYSROOT"/lib/libLLVM*.so; do
            if [ -f "$f" ] && [ ! -L "$f" ] && grep -q '^INPUT(' "$f" 2>/dev/null; then
              target=$(sed -n 's/^INPUT(\(.*\))/\1/p' "$f")
              ln -sf "$target" "$f"
            fi
          done

          cargo test --locked -p flowcone-common
          (cd crates/flowcone-ebpf && cargo +nightly fmt --check && cargo +nightly clippy --locked --target=bpfel-unknown-none -Z build-std=core -- -D warnings)

      - name: Build flowcone-ebpf
        shell: bash
        run: |
          cargo run --locked --manifest-path xtask/Cargo.toml -- build-ebpf
          readelf -S crates/flowcone-daemon/ebpf/flowcone-ebpf.bin | grep -q '\.BTF'
          ! readelf -S crates/flowcone-daemon/ebpf/flowcone-ebpf.bin | grep -q '\.debug_info'

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add crates/flowcone-daemon/ebpf/flowcone-ebpf.bin

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in flowcone-ebpf.bin."
          else
            git commit -m "auto: update flowcone-ebpf.bin [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master

      - name: Trigger build packages
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Build packages" --ref master
