name: Build packages

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions (space-separated, e.g. 25)'
        required: false
        default: '25'
        type: string
  push:
    branches:
      - master
    paths:
      - 'openwrt/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write
  actions: write

env:
  OPENWRT_MAJORS: '25'

jobs:
  prepare:
    name: Prepare version and matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' openwrt/flowcone/Makefile | head -n 1 | cut -d= -f2)
          pkg_release=$(grep '^PKG_RELEASE:=' openwrt/flowcone/Makefile | head -n 1 | cut -d= -f2)

          version="${pkg_version}-r${pkg_release}"
          release_tag="flowcone_${version}"
          release_name="FlowCone ${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Release tag: ${release_tag}"

      - name: Resolve latest SDK releases
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}\.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}\." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.prepare.outputs.sdks) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust musl target & cross linker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

          if [ "${{ matrix.arch }}" = "aarch64_generic" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
            rustup target add aarch64-unknown-linux-musl
            echo "RUST_TARGET=aarch64-unknown-linux-musl" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          else
            rustup target add x86_64-unknown-linux-musl
            echo "RUST_TARGET=x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
          fi

      - name: Prebuild flowcone binary on host
        shell: bash
        run: |
          set -euo pipefail
          echo "Building flowcone-daemon for target: $RUST_TARGET"
          cargo build --release --locked -p flowcone-daemon --target "$RUST_TARGET"

          mkdir -p openwrt/flowcone/files
          cp "target/${RUST_TARGET}/release/flowcone" openwrt/flowcone/files/flowcone.bin
          chmod +x openwrt/flowcone/files/flowcone.bin
          cp LICENSE openwrt/flowcone/files/LICENSE

      - name: Prepare Makefile for SDK build
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re
          import textwrap

          with open('openwrt/flowcone/Makefile', 'r') as f:
              orig = f.read()

          v_m = re.search(r'^PKG_VERSION:=(.*)$', orig, re.M)
          r_m = re.search(r'^PKG_RELEASE:=(.*)$', orig, re.M)
          m_m = re.search(r'^PKG_MAINTAINER:=(.*)$', orig, re.M)

          pkg_version = v_m.group(1).strip() if v_m else "0.1.0"
          pkg_release = r_m.group(1).strip() if r_m else "1"
          pkg_maintainer = m_m.group(1).strip() if m_m else "QiuSimons"

          makefile = textwrap.dedent(f"""\
          include $(TOPDIR)/rules.mk

          PKG_NAME:=flowcone
          PKG_VERSION:={pkg_version}
          PKG_RELEASE:={pkg_release}

          PKG_LICENSE:=GPL-3.0-or-later
          PKG_LICENSE_FILES:=LICENSE
          PKG_MAINTAINER:={pkg_maintainer}

          include $(INCLUDE_DIR)/package.mk

          FLOWCONE_RUST_ARCH_DEPENDS:=@(aarch64||arm||i386||i686||riscv64||x86_64)

          define Package/flowcone
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=Routing and Redirection
            TITLE:=RFC 4787 Full-Cone NAT using eBPF and TCX
            URL:=https://github.com/QiuSimons/FlowCone
            DEPENDS:=$(FLOWCONE_RUST_ARCH_DEPENDS) \\
              +nftables +kmod-sched-core +kmod-sched-bpf
          endef

          define Package/flowcone/description
            Dual-stack RFC 4787 Full-Cone NAT for OpenWrt using eBPF and TCX.
          endef

          define Package/flowcone/conffiles
          /etc/config/flowcone
          endef

          define Build/Prepare
          \tmkdir -p $(PKG_BUILD_DIR)
          \t$(CP) $(CURDIR)/files/LICENSE $(PKG_BUILD_DIR)/LICENSE
          endef

          define Build/Configure
          endef

          define Build/Compile
          endef

          define Package/flowcone/install
          \t$(INSTALL_DIR) $(1)/usr/bin/
          \t$(INSTALL_BIN) $(CURDIR)/files/flowcone.bin $(1)/usr/bin/flowcone

          \t$(INSTALL_DIR) $(1)/etc/config/
          \t$(INSTALL_CONF) $(CURDIR)/files/flowcone.config $(1)/etc/config/flowcone

          \t$(INSTALL_DIR) $(1)/etc/init.d/
          \t$(INSTALL_BIN) $(CURDIR)/files/flowcone.init $(1)/etc/init.d/flowcone
          endef

          define Package/flowcone/postrm
          #!/bin/sh
          rm -f /usr/share/nftables.d/chain-pre/srcnat/10-flowcone.nft
          rm -f /usr/share/nftables.d/chain-pre/forward/10-flowcone.nft
          rm -f /etc/nftables.d/flowcone.nft
          exit 0
          endef

          $(eval $(call BuildPackage,flowcone))
          """)

          with open('openwrt/flowcone/Makefile', 'w') as f:
              f.write(makefile)
          PYEOF

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: docker.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: flowcone luci-app-flowcone nat6
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Show built files
        shell: bash
        run: |
          echo "=== Built package files ==="
          find bin/packages -type f | grep -E '\.(ipk|apk)$' || true
          echo "==========================="

      - name: Prepare renamed artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in $(find bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \)); do
            base="$(basename "$f")"
            ext="${base##*.}"
            name="${base%.*}"

            # Filter for FlowCone packages only
            if [[ "$base" != *flowcone* && "$base" != nat6* ]]; then
              continue
            fi

            if [[ "$name" == *"${{ matrix.arch }}"* ]] || [[ "$name" == *"all"* ]] || [[ "$name" == luci-* ]]; then
              new_name="${name}-openwrt-${{ matrix.sdk }}.${ext}"
            else
              new_name="${name}-${{ matrix.arch }}-openwrt-${{ matrix.sdk }}.${ext}"
            fi

            cp "$f" "dist/${new_name}"
          done

          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files were copied to dist"
            exit 1
          fi

          ls -lah dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: release-dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
