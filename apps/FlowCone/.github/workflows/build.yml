name: Build packages

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions (space-separated, e.g. 25)'
        required: false
        default: '25'
        type: string
  push:
    branches:
      - master
    paths:
      - 'openwrt/**'
      - 'crates/flowcone-daemon/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  OPENWRT_MAJORS: '25'

jobs:
  check:
    name: Format, clippy, unit tests & shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          (cd xtask && cargo fmt --check && cargo clippy --all-targets -- -D warnings)
          shellcheck -s sh -e SC2034,SC3043 \
            openwrt/flowcone/files/flowcone.init \
            openwrt/nat6/files/nat6.init \
            openwrt/nat6/files/nat6-flowcone.init
          shellcheck -s sh openwrt/nat6/files/nat6.hotplug

  prepare:
    name: Prepare version and matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' openwrt/flowcone/Makefile | head -n 1 | cut -d= -f2)
          pkg_release=$(grep '^PKG_RELEASE:=' openwrt/flowcone/Makefile | head -n 1 | cut -d= -f2)

          version="${pkg_version}-r${pkg_release}"
          release_tag="flowcone_${version}"
          release_name="FlowCone ${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Release tag: ${release_tag}"

      - name: Resolve latest SDK releases
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}\.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}\." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.prepare.outputs.sdks) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust musl target & cross linker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

          rustup update stable
          if [ "${{ matrix.arch }}" = "aarch64_generic" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
            rustup target add aarch64-unknown-linux-musl
            echo "RUST_TARGET=aarch64-unknown-linux-musl" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          else
            rustup target add x86_64-unknown-linux-musl
            echo "RUST_TARGET=x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
          fi

      - name: Prebuild flowcone binary on host
        shell: bash
        run: |
          set -euo pipefail
          echo "Building flowcone-daemon for target: $RUST_TARGET"
          cargo build --release --locked -p flowcone-daemon --target "$RUST_TARGET"

          mkdir -p openwrt/flowcone/files
          cp "target/${RUST_TARGET}/release/flowcone" openwrt/flowcone/files/flowcone.bin
          chmod +x openwrt/flowcone/files/flowcone.bin
          cp LICENSE openwrt/flowcone/files/LICENSE

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: docker.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: flowcone luci-app-flowcone nat6
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Show built files
        shell: bash
        run: |
          echo "=== Built package files ==="
          find bin/packages -type f | grep -E '\.(ipk|apk)$' || true
          echo "==========================="

      - name: Prepare renamed artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SDK: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in $(find bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \)); do
            base="$(basename "$f")"
            ext="${base##*.}"
            name="${base%.*}"

            # FlowCone packages only.
            [[ "$base" == *flowcone* || "$base" == nat6* ]] || continue

            # Architecture-independent packages ship once, from the x86_64 job.
            noarch=0
            [[ "$name" == *"_all"* || "$name" == *"-noarch"* || "$name" == luci-* || "$name" == nat6* ]] && noarch=1 || true
            [[ $noarch == 1 && "$ARCH" != x86_64 ]] && continue || true

            # Append the arch only when the package name does not already carry it.
            suffix=""
            [[ $noarch == 1 || "$name" == *"$ARCH"* ]] || suffix="-$ARCH"

            # GitHub rewrites `~` to `.` in asset names, so sanitize locally too. The
            # pattern needs \~ : a bare ~ does not match and the line becomes a no-op.
            new_name="${name}${suffix}-openwrt-${SDK}.${ext}"
            new_name="${new_name//\~/.}"
            cp "$f" "dist/${new_name}"
          done

          files=(dist/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No package files were copied to dist"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - check
      - prepare
      - build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist
          merge-multiple: true

      # Every run re-publishes the complete set, so drop whatever is there instead of
      # trying to match names: GitHub rewrites `~` to `.` on upload, which makes any
      # name comparison miss and the upload fail with "already_exists".
      - name: Clear existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || exit 0
          for asset in $(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'); do
            echo "Deleting $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: release-dist/*
          overwrite_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
