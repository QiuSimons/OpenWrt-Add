name: Build packages

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions (space-separated, e.g. 24 25)'
        required: false
        default: '24 25'
        type: string
  push:
    branches:
      - master
    paths:
      - 'honk/**'
      - 'luci-app-honk/**'
      - '.github/workflows/build-packages.yml'

permissions:
  contents: write
  actions: write

env:
  OPENWRT_MAJORS: '24 25'

jobs:
  prepare:
    name: Prepare version and matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' honk/Makefile | head -n 1 | cut -d= -f2)
          pkg_release=$(grep '^PKG_RELEASE:=' honk/Makefile | head -n 1 | cut -d= -f2)

          version="${pkg_version}-r${pkg_release}"
          release_tag="honk_${version}"
          release_name="honk_${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Release tag: ${release_tag}"

      - name: Resolve latest SDK releases
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}\.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}\." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.prepare.outputs.sdks) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone honk source
        shell: bash
        run: |
          set -euo pipefail
          pkg_source_url=$(grep -E '^[[:space:]]*PKG_SOURCE_URL:=' honk/Makefile | head -n 1 | cut -d= -f2 | tr -d '[:space:]')
          pkg_source_ver=$(grep -E '^[[:space:]]*PKG_SOURCE_VERSION:=' honk/Makefile | head -n 1 | cut -d= -f2 | tr -d '[:space:]')
          echo "Cloning ${pkg_source_url} (commit: ${pkg_source_ver})..."
          git clone "${pkg_source_url}" honk-src
          (cd honk-src && git checkout "${pkg_source_ver}")

      - name: Setup Rust targets & toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev cmake libclang-dev zstd

          if [ "${{ matrix.arch }}" = "aarch64_generic" ]; then
            T="aarch64-unknown-linux-musl"
          else
            T="x86_64-unknown-linux-musl"
          fi
          echo "RUST_TARGET=$T" >> "$GITHUB_ENV"

          # 关键：必须在 honk-src 下为 rust-toolchain.toml 指定的 toolchain 安装 target
          (cd honk-src && rustup target add "$T")

          # 提取并安装 honk-ebpf 锁定的 nightly toolchain 及其组件
          EBPF_CHANNEL=$(grep -oP '^channel\s*=\s*"\K[^"]+' honk-src/crates/honk-ebpf/rust-toolchain.toml 2>/dev/null || echo "nightly")
          echo "EBPF_CHANNEL=$EBPF_CHANNEL" >> "$GITHUB_ENV"
          rustup toolchain install "$EBPF_CHANNEL" --component rust-src,llvm-tools

      - name: Setup Zig for musl C/C++ cross-compilation
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install bpf-linker
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst | sudo tar --zstd -xf - -C /usr/local/bin
          bpf-linker --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            honk-src -> target
            honk-src/crates/honk-ebpf -> target

      - name: Build honk-ebpf object
        shell: bash
        run: |
          set -euo pipefail
          cd honk-src/crates/honk-ebpf
          cargo "+${EBPF_CHANNEL}" build --release -Zbuild-std=core --target bpfel-unknown-none

      - name: Prebuild honk-core on host
        shell: bash
        run: |
          set -euo pipefail
          cd honk-src
          T="${RUST_TARGET}"
          export ZIGCC_TARGET="${T/-unknown/}"
          L=$(printf '%s' "$T" | tr '-' '_')
          U=$(printf '%s' "$T" | tr 'a-z-' 'A-Z_')
          export "CC_${L}=$PWD/ci/zigcc"
          export "CXX_${L}=$PWD/ci/zigcxx"
          export "CARGO_TARGET_${U}_LINKER=$PWD/ci/zigcc"
          if [[ "$T" == *-musl ]]; then
            export "CARGO_TARGET_${U}_RUSTFLAGS=-C link-self-contained=no"
          fi

          echo "Building honk-core for target: $T"
          cargo build --release --locked \
            -p honk-core \
            --no-default-features \
            --features ebpf,rprx,native-api,mimalloc \
            --target "$T"

          mkdir -p ../honk/files
          cp "target/${T}/release/honk-core" ../honk/files/honk-core.bin
          chmod +x ../honk/files/honk-core.bin

      - name: Prepare Makefile for SDK build
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re
          import textwrap

          with open('honk/Makefile', 'r') as f:
              orig = f.read()

          v_m = re.search(r'^PKG_VERSION:=(.*)$', orig, re.M)
          r_m = re.search(r'^PKG_RELEASE:=(.*)$', orig, re.M)
          m_m = re.search(r'^PKG_MAINTAINER:=(.*)$', orig, re.M)

          pkg_version = v_m.group(1).strip() if v_m else "0.1.0"
          pkg_release = r_m.group(1).strip() if r_m else "1"
          pkg_maintainer = m_m.group(1).strip() if m_m else "QiuSimons"

          makefile = textwrap.dedent(f"""\
          include $(TOPDIR)/rules.mk

          PKG_NAME:=honk
          PKG_VERSION:={pkg_version}
          PKG_RELEASE:={pkg_release}

          PKG_LICENSE:=AGPL-3.0-only
          PKG_LICENSE_FILES:=LICENSE
          PKG_MAINTAINER:={pkg_maintainer}

          include $(INCLUDE_DIR)/package.mk

          HONK_RUST_ARCH_DEPENDS:=@(aarch64||x86_64)

          define Package/honk
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=Web Servers/Proxies
            TITLE:=honk - eBPF transparent proxy engine (dae-compatible)
            URL:=https://github.com/daeuniverse/honk
            DEPENDS:=$(HONK_RUST_ARCH_DEPENDS) \\
              +ca-bundle +ip-full \\
              +kmod-sched-core +kmod-sched-bpf +kmod-veth +kmod-nft-queue \\
              +v2ray-geoip +v2ray-geosite \\
              +@KERNEL_XDP_SOCKETS
          endef

          define Package/honk/conffiles
          /etc/honk/config.dae
          /etc/honk/config.d/
          /etc/honk/state/
          /etc/config/honk
          endef

          define Build/Prepare
          \tmkdir -p $(PKG_BUILD_DIR)
          endef

          define Build/Configure
          endef

          define Build/Compile
          endef

          define Package/honk/install
          \t$(INSTALL_DIR) $(1)/usr/bin
          \t$(INSTALL_BIN) $(CURDIR)/files/honk-core.bin $(1)/usr/bin/honk-core

          \t$(INSTALL_DIR) $(1)/etc/honk/config.d
          \t$(INSTALL_CONF) $(CURDIR)/files/config.dae $(1)/etc/honk/config.dae
          \t$(INSTALL_CONF) $(CURDIR)/files/config.d/node.dae $(1)/etc/honk/config.d/node.dae
          \t$(INSTALL_CONF) $(CURDIR)/files/config.d/route.dae $(1)/etc/honk/config.d/route.dae
          \t$(INSTALL_CONF) $(CURDIR)/files/config.d/dns.dae $(1)/etc/honk/config.d/dns.dae
          \t$(INSTALL_CONF) $(CURDIR)/files/config.d/api.dae $(1)/etc/honk/config.d/api.dae

          \t$(INSTALL_DIR) $(1)/etc/config
          \t$(INSTALL_CONF) $(CURDIR)/files/honk.config $(1)/etc/config/honk

          \t$(INSTALL_DIR) $(1)/etc/init.d
          \t$(INSTALL_BIN) $(CURDIR)/files/honk.init $(1)/etc/init.d/honk
          endef

          $(eval $(call BuildPackage,honk))
          """)

          with open('honk/Makefile', 'w') as f:
              f.write(makefile)
          PYEOF

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: docker.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: honk luci-app-honk
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Show built files
        shell: bash
        run: |
          echo "=== Built package files ==="
          find bin/packages -type f | grep -E '\.(ipk|apk)$' || true
          echo "==========================="

      - name: Prepare renamed artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in $(find bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \)); do
            base="$(basename "$f")"
            ext="${base##*.}"
            name="${base%.*}"

            # Filter for honk packages only
            if [[ "$base" != *honk* ]]; then
              continue
            fi

            if [[ "$name" == *"${{ matrix.arch }}"* ]] || [[ "$name" == *"all"* ]] || [[ "$name" == luci-* ]]; then
              new_name="${name}-openwrt-${{ matrix.sdk }}.${ext}"
            else
              new_name="${name}-${{ matrix.arch }}-openwrt-${{ matrix.sdk }}.${ext}"
            fi

            cp "$f" "dist/${new_name}"
          done

          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files were copied to dist"
            exit 1
          fi

          ls -lah dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: release-dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
