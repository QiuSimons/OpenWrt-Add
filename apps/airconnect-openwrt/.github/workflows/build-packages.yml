name: Build packages

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions (space-separated, e.g. 25)'
        required: false
        default: '25'
        type: string

permissions:
  contents: write
  actions: write

env:
  OPENWRT_MAJORS: '25'

jobs:
  prepare:
    name: Prepare version and matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' airconnect/Makefile | head -n 1 | cut -d= -f2 | tr -d ' \r\n')
          pkg_release=$(grep '^PKG_RELEASE:=' airconnect/Makefile | head -n 1 | cut -d= -f2 | tr -d ' \r\n')

          version="${pkg_version}-r${pkg_release}"
          release_tag="airconnect_${version}"
          release_name="AirConnect ${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Release tag: ${release_tag}"

      - name: Resolve latest SDK releases
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}\.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}\." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.prepare.outputs.sdks) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: docker.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: airconnect luci-app-airconnect
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true
          UPSTREAM_URL: https://openwrt.fastly.net
          FILE_HOST: https://openwrt.fastly.net

      - name: Show built files
        shell: bash
        run: |
          echo "=== Built package files ==="
          find bin/packages -type f | grep -E '\.(ipk|apk)$' || true
          echo "==========================="

      - name: Prepare renamed artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in $(find bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \)); do
            base="$(basename "$f")"
            ext="${base##*.}"
            name="${base%.*}"

            # Filter for AirConnect packages only
            if [[ "$base" != *airconnect* ]]; then
              continue
            fi

            if [[ "$name" == *"${{ matrix.arch }}"* ]] || [[ "$name" == *"all"* ]] || [[ "$name" == luci-* ]]; then
              new_name="${name}-openwrt-${{ matrix.sdk }}.${ext}"
            else
              new_name="${name}-${{ matrix.arch }}-openwrt-${{ matrix.sdk }}.${ext}"
            fi

            cp "$f" "dist/${new_name}"
          done

          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files were copied to dist"
            exit 1
          fi

          ls -lah dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: release-dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
