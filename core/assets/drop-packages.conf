# ==============================================================================
# 从本 feed 的构建系统中摘除的包
#
# 格式: <staging_feed 内的包目录> <要摘除的包名>
# 用途: 互斥变体只发布其中一个时，直接从 Makefile 移除它的 BuildPackage 求值，
#       这样 kconfig 里根本不存在该符号，任何 select / 默认值都无法把它选回来。
# ==============================================================================

# sing-box 只发布 tiny 变体（custom.sh 的 patch_singbox_tiny.sh 设其为默认，
# prebuild_host.sh 也只编 tiny 的 tag 集合）；full 变体从构建系统摘除。
imm_pkg/sing-box    sing-box
