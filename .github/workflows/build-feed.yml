name: Build APK Feed & ImageBuilder Bundle

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions to build (space-separated, e.g. 25)'
        required: false
        default: '25'
        type: string
  schedule:
    - cron: '47 20 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OPENWRT_MAJORS: '25'

jobs:
  resolve-sdks:
    name: Resolve Target SDK Matrix
    runs-on: ubuntu-latest
    outputs:
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Resolve Latest SDK Releases (No GitHub API)
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          # Resolve latest release tags
          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  build-packages:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: resolve-sdks
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.resolve-sdks.outputs.sdks) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Assemble Combined Feed (Apps + Themes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging_feed artifacts
          cp -a apps/* staging_feed/ 2>/dev/null || true
          cp -a themes/* staging_feed/ 2>/dev/null || true
          echo "Total packages in feed to build: $(find staging_feed -maxdepth 2 -name Makefile | wc -l)"

      - name: Compile Packages in OpenWrt SDK Container
        shell: bash
        run: |
          set -euo pipefail

          image="docker.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}"
          echo "Pulling SDK image ${image}..."
          docker pull "${image}"

          docker run --rm \
            --user root \
            -e UPSTREAM_URL="https://openwrt.fastly.net" \
            -e FILE_HOST="https://openwrt.fastly.net" \
            -v "${{ github.workspace }}/staging_feed:/feed:ro" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            "${image}" \
            bash -c '
              set -e

              # Install host tools
              if command -v apt-get >/dev/null 2>&1; then
                if [ -f /etc/debian_version ] && grep -q "^11" /etc/debian_version; then
                  printf "deb [check-valid-until=no trusted=yes] http://archive.debian.org/debian/ bullseye main\ndeb [check-valid-until=no trusted=yes] http://archive.debian.org/debian-security/ bullseye-security main\n" > /etc/apt/sources.list
                  rm -rf /etc/apt/sources.list.d/*
                fi
                apt-get update -o Acquire::Check-Valid-Until=false || apt-get update
                apt-get install -y --no-install-recommends dwarves llvm || apt-get install -y dwarves llvm || apt-get install -y pahole
                rm -rf /var/lib/apt/lists/*
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache dwarves
              fi

              pahole_bin="$(command -v pahole || which pahole || true)"
              if [ -n "$pahole_bin" ] && [ -x "$pahole_bin" ]; then
                mkdir -p /builder/staging_dir/host/bin
                ln -sf "$pahole_bin" /builder/staging_dir/host/bin/pahole
              fi

              llvm_objcopy_bin="$(command -v llvm-objcopy || find /usr/bin -name "llvm-objcopy*" 2>/dev/null | head -n 1 || true)"
              if [ -n "$llvm_objcopy_bin" ]; then
                mkdir -p /builder/staging_dir/host/bin
                ln -sf "$llvm_objcopy_bin" /builder/staging_dir/host/bin/llvm-objcopy
              fi

              chown -R 1000:1000 /builder /artifacts
              su -s /bin/bash buildbot -c '''
                set -e
                [ ! -f setup.sh ] || bash setup.sh
                echo "src-link custom /feed" > feeds.conf
                ./scripts/feeds update custom
                ./scripts/feeds install -a -p custom

                pkgs=$(find /feed -type f -name Makefile -exec grep -H "^PKG_NAME:=" {} + | awk -F":=" "{print \$2}" | tr -d "[:space:]" | sort -u)
                for p in $pkgs; do
                  echo "CONFIG_PACKAGE_$p=m" >> .config
                done

                make defconfig

                make package/compile -j$(nproc) IGNORE_ERRORS=1 || make package/compile -j1 IGNORE_ERRORS=1 V=s || true

                mkdir -p /artifacts/bin
                find bin/packages/ -type f -name "*.apk" -exec cp {} /artifacts/bin/ \; 2>/dev/null || true
              '''
            '

          sudo chown -R "$USER:$USER" "${{ github.workspace }}/artifacts"

      - name: Show Built Files
        if: always()
        shell: bash
        run: |
          echo "=== Built package files ==="
          find artifacts/bin/ -type f 2>/dev/null | grep -E '.(ipk|apk)$' || true
          echo "==========================="

      - name: Prepare Staging Artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          find artifacts/bin/ -type f -name "*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          echo "Total APKs successfully prepared: $(ls -1 dist/*.apk 2>/dev/null | wc -l)"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.arch }}-${{ matrix.sdk }}
          path: dist/*.apk
          if-no-files-found: warn

  publish-feed:
    name: Smart Fan-out, Sign & Deploy Feed
    needs: build-packages
    runs-on: ubuntu-latest
    if: always() && needs.build-packages.result != 'cancelled'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Built APKs
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts
          merge-multiple: true

      - name: Install Host Tools (apk-tools & signing)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apk-tools openssl zstd python3

      - name: Execute Smart Fan-out
        run: |
          python3 core/scripts/smart_fanout.py raw_artifacts public

      - name: Setup Signing Keys
        env:
          FEED_PRIVATE_KEY: ${{ secrets.FEED_KEY }}
        run: |
          mkdir -p certs
          if [ -n "$FEED_PRIVATE_KEY" ]; then
            echo "$FEED_PRIVATE_KEY" > certs/feed-key.pem
            chmod 600 certs/feed-key.pem
            openssl rsa -in certs/feed-key.pem -pubout -out certs/custom-feed.rsa.pub
          else
            echo "[INFO] 未检测到 FEED_KEY Secret，生成构建期临时签名密钥对..."
            openssl genrsa -out certs/feed-key.pem 2048
            openssl rsa -in certs/feed-key.pem -pubout -out certs/custom-feed.rsa.pub
          fi

          mkdir -p public/keys
          cp certs/custom-feed.rsa.pub public/keys/custom-feed.rsa.pub

      - name: Generate Signed Index (packages.adb) for Each Architecture
        run: |
          for dir in public/*; do
            if [ -d "$dir" ] && [ "$(basename "$dir")" != "keys" ]; then
              arch_tag=$(basename "$dir")
              cd "$dir"
              if compgen -G "*.apk" > /dev/null; then
                echo "--> Indexing & Signing $arch_tag repository..."
                apk mkndx --allow-untrusted -o packages.adb --sign ../certs/feed-key.pem *.apk
              fi
              cd - > /dev/null
            fi
          done

      - name: Build ImageBuilder Offline Bundle
        run: |
          mkdir -p dist
          tar -czf dist/openwrt-add-apks-bundle.tar.gz -C public .
          echo "=== ImageBuilder 离线包制作完成 ==="
          ls -lh dist/openwrt-add-apks-bundle.tar.gz

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload ImageBuilder Bundle to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-packages
          name: "OpenWrt-Add Precompiled APKs"
          files: dist/openwrt-add-apks-bundle.tar.gz
