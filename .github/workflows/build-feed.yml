name: Build APK Feed & ImageBuilder Bundle

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions to build (space-separated, e.g. 25)'
        required: false
        default: '25'
        type: string
  schedule:
    - cron: '47 20 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OPENWRT_MAJORS: '25'

jobs:
  resolve-sdks:
    name: Resolve Target SDK Matrix
    runs-on: ubuntu-latest
    outputs:
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Resolve Latest SDK Releases (No GitHub API)
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          # Resolve latest release tags
          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  prebuild:
    name: Prebuild ${{ matrix.arch }} binaries on host
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # key 覆盖所有影响产物的输入：各包 Makefile 里的版本/URL、vendored 的
      # flowcone 源码、以及构建脚本自身。命中即代表可以整段跳过预编译。
      - name: Restore prebuilt binaries
        id: prebuilt-cache
        uses: actions/cache@v4
        with:
          path: prebuilt
          key: prebuilt-bin-${{ matrix.arch }}-${{ hashFiles('core/scripts/prebuild_host.sh', 'apps/**/Makefile', 'apps/FlowCone/Cargo.lock', 'apps/FlowCone/crates/**') }}
          restore-keys: |
            prebuilt-bin-${{ matrix.arch }}-

      - name: Set up Go
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install cross toolchain
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq

          # runner 镜像通常已自带 clang / llvm-strip，缺失时才安装
          need() {
            command -v "$1" >/dev/null 2>&1 || sudo apt-get install -y -qq --no-install-recommends "$2"
          }
          need clang clang
          need llvm-strip llvm
          if [ "${{ matrix.arch }}" = "aarch64_generic" ]; then
            need aarch64-linux-gnu-gcc gcc-aarch64-linux-gnu
            rustup target add aarch64-unknown-linux-musl
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          else
            rustup target add x86_64-unknown-linux-musl
          fi

          clang --version | head -n 1
          llvm-strip --version | head -n 1

      - name: Cache Go module downloads
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: prebuild-gomod-${{ matrix.arch }}-${{ hashFiles('apps/**/Makefile') }}
          restore-keys: |
            prebuild-gomod-${{ matrix.arch }}-

      - name: Cache cargo registry
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: prebuild-cargo-${{ matrix.arch }}-${{ hashFiles('apps/openwrt-einat-ebpf/Makefile') }}
          restore-keys: |
            prebuild-cargo-${{ matrix.arch }}-

      - name: Prebuild host binaries
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./core/scripts/prebuild_host.sh "${{ matrix.arch }}" prebuilt

      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-${{ matrix.arch }}
          path: prebuilt
          if-no-files-found: error
          retention-days: 1

  build-packages:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs:
      - resolve-sdks
      - prebuild
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.resolve-sdks.outputs.sdks) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: prebuilt-${{ matrix.arch }}
          path: prebuilt

      - name: Assemble Combined Feed (Apps + Themes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging_feed artifacts dl node_prebuilt
          cp -a apps/* staging_feed/ 2>/dev/null || true
          cp -a themes/* staging_feed/ 2>/dev/null || true
          if [ -d staging_feed/feeds_packages_lang_node-prebuilt ]; then
            cp -a staging_feed/feeds_packages_lang_node-prebuilt/. node_prebuilt/
            rm -rf staging_feed/feeds_packages_lang_node-prebuilt
          fi
          echo "Total packages in feed to build: $(find staging_feed -maxdepth 2 -name Makefile | wc -l)"

      - name: Apply prebuilt binaries to feed
        shell: bash
        run: ./core/scripts/apply_prebuilt.sh staging_feed /prebuilt prebuilt

      - name: Cache OpenWrt Package Downloads (dl)
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ matrix.arch }}-${{ matrix.sdk }}-dl-${{ hashFiles('staging_feed/**/Makefile') }}
          restore-keys: |
            ${{ matrix.arch }}-${{ matrix.sdk }}-dl-

      - name: Compile Packages in OpenWrt SDK Container
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          image="docker.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}"
          echo "Pulling SDK image ${image}..."
          docker pull "${image}"

          docker run --rm \
            --user root \
            -v "${{ github.workspace }}/staging_feed:/feed:ro" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            -v "${{ github.workspace }}/dl:/builder/dl" \
            -v "${{ github.workspace }}/node_prebuilt:/node_prebuilt:ro" \
            -v "${{ github.workspace }}/prebuilt:/prebuilt:ro" \
            -v "${{ github.workspace }}/core/scripts/build_in_container.sh:/build.sh:ro" \
            "${image}" \
            bash /build.sh

          sudo chown -R "$USER:$USER" "${{ github.workspace }}/artifacts"

      - name: Show Built Files
        if: always()
        shell: bash
        run: |
          echo "=== Built package files ==="
          find artifacts/bin/ -type f 2>/dev/null | grep -E '.(ipk|apk)$' || true
          echo "==========================="

      - name: Prepare Staging Artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          find artifacts/bin/ -type f -name "*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          echo "Total APKs successfully prepared: $(ls -1 dist/*.apk 2>/dev/null | wc -l)"

      - name: Verify package manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 core/scripts/verify_manifest.py \
            --expected artifacts/manifest/expected.txt \
            --apk-dir artifacts/bin \
            --allow-missing core/assets/build-allow-missing.conf

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.arch }}-${{ matrix.sdk }}
          path: dist/*.apk
          if-no-files-found: warn

  publish-feed:
    name: Smart Fan-out, Sign & Deploy Feed
    needs: build-packages
    runs-on: ubuntu-latest
    if: always() && needs.build-packages.result != 'cancelled'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download All Built APKs
        uses: actions/download-artifact@v8
        with:
          path: raw_artifacts
          merge-multiple: true

      - name: Install apk-tools (static, no apt dependency)
        shell: bash
        run: |
          set -euo pipefail

          # Ubuntu 24.04 软件源里没有 apk-tools，这正是此前 4h40m 构建被 5 秒
          # apt 失败清零的根因。改为直接取 Alpine 官方静态构建，零发行版依赖。
          ALPINE_BRANCH="v3.22"
          MIRROR="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/main/x86_64"
          TMP="$(mktemp -d)"

          curl -fsSL --retry 3 -o "$TMP/APKINDEX.tar.gz" "$MIRROR/APKINDEX.tar.gz"
          tar -xzf "$TMP/APKINDEX.tar.gz" -C "$TMP" APKINDEX
          APK_VER="$(awk '/^P:apk-tools-static$-/{f=1;next} f&&/^V:/{sub(/^V:/,"");print;exit}' "$TMP/APKINDEX")"
          [ -n "$APK_VER" ] || { echo "::error::无法从 APKINDEX 解析 apk-tools-static 版本"; exit 1; }
          echo "apk-tools-static version: $APK_VER"

          curl -fsSL --retry 3 -o "$TMP/apk-tools-static.apk" "$MIRROR/apk-tools-static-${APK_VER}.apk"
          mkdir -p "$TMP/x" && tar -xzf "$TMP/apk-tools-static.apk" -C "$TMP/x"
          sudo install -m0755 "$TMP/x/sbin/apk.static" /usr/local/bin/apk

          apk --version | head -n 1
          for t in openssl zstd python3 tar; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::missing required tool: $t"; exit 1; }
          done


      - name: Execute Smart Fan-out
        run: |
          python3 core/scripts/smart_fanout.py raw_artifacts public

      - name: Setup Signing Keys
        env:
          FEED_PRIVATE_KEY: ${{ secrets.FEED_KEY }}
        run: |
          mkdir -p certs
          if [ -n "$FEED_PRIVATE_KEY" ]; then
            echo "$FEED_PRIVATE_KEY" > certs/feed-key.pem
            chmod 600 certs/feed-key.pem
            openssl rsa -in certs/feed-key.pem -pubout -out certs/custom-feed.rsa.pub
          else
            echo "[INFO] 未检测到 FEED_KEY Secret，生成构建期临时签名密钥对..."
            openssl genrsa -out certs/feed-key.pem 2048
            openssl rsa -in certs/feed-key.pem -pubout -out certs/custom-feed.rsa.pub
          fi

          mkdir -p public/keys
          cp certs/custom-feed.rsa.pub public/keys/custom-feed.rsa.pub

      - name: Generate Signed Index (packages.adb) for Each Architecture
        run: |
          for dir in public/*; do
            if [ -d "$dir" ] && [ "$(basename "$dir")" != "keys" ]; then
              arch_tag=$(basename "$dir")
              cd "$dir"
              if compgen -G "*.apk" > /dev/null; then
                echo "--> Indexing & Signing $arch_tag repository..."
                apk mkndx --allow-untrusted -o packages.adb --sign ../certs/feed-key.pem *.apk
              fi
              cd - > /dev/null
            fi
          done

      - name: Build ImageBuilder Offline Bundle
        run: |
          mkdir -p dist
          tar -czf dist/openwrt-add-apks-bundle.tar.gz -C public .
          echo "=== ImageBuilder 离线包制作完成 ==="
          ls -lh dist/openwrt-add-apks-bundle.tar.gz

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload ImageBuilder Bundle to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-packages
          name: "OpenWrt-Add Precompiled APKs"
          files: dist/openwrt-add-apks-bundle.tar.gz