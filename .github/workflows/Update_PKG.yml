name: Update PKG

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patch curl git

      - name: Sync and Standardize Packages
        run: |
          chmod +x core/scripts/*.sh core/tools/*.sh 2>/dev/null || true
          bash core/scripts/update.sh

      - name: Commit changes
        run: |
          git config --global user.email "simonsqiu@foxmail.com"
          git config --global user.name "SimonsQiu"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update $(date +'%Y/%m/%d %H:%M:%S %Z')"
          else
            echo "No changes to commit."
          fi
        continue-on-error: true

      - name: Push changes
        run: |
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master
        continue-on-error: true

      - name: Cleanup Workflow Logs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
        continue-on-error: true
